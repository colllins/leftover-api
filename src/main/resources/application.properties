spring.application.name=leftover-api

server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/leftoverapi
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

pay-period.closed.queue.name=PAY_PERIOD_CLOSED_QUEUE
pay-period.exchange.name=PAY_PERIOD_EXCHANGE
pay-period.routing.key=PAY_PERIOD_CLOSED_ROUTING_KEY

spring.redis.host=redis
spring.redis.port=6379
spring.cache.type=redis

spring.mail.host=email-smtp.us-east-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${AWS_SES_SMTP_USERNAME}
spring.mail.password=${AWS_SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true